# Composite action: describe a pull request in Traditional Chinese, draw the
# flows it changes with the PR Lens renderer, and comment both.
#
# The model endpoint, model name, and key, and the PR Lens account token, come
# from Infisical through the infisical-fetch action, so none of them lives in
# GitHub or in this public repo.
#
# What the comment shows is decided from the diff, not by the model: up to two
# flow diagrams, else one architecture diagram, else text only. A change of
# fewer than 20 lines outside tests and docs is always text only.
#
# Each pull request also gets one canvas on prlens.dev, the interactive view,
# linked from the comment. It holds the drawn graph document, not the code.
# The calling job must declare:
#   permissions:
#     contents: write        # push the SVGs to the data branch
#     pull-requests: write   # post the comment
#     id-token: write        # Infisical OIDC
# and check out with `fetch-depth: 0`, because the diff needs both commits.
#
# Run it only on same-repository pull requests. A fork gets no OIDC token, so
# the Infisical fetch fails.
#
# On a pull_request event the pull request comes from the event. Any other
# event must pass pr-number, base-sha, and head-sha, and check out head-sha.
# The reusable workflow .github/workflows/reusable-pr-lens.yml does both.

name: "PR Lens"
description: "Describe a pull request in Traditional Chinese with a model from Infisical, render the flows it changes as SVGs, publish them to a data branch, push a canvas to prlens.dev, and keep one comment up to date."
inputs:
  identity-id:
    description: "Infisical machine-identity id bound to the calling repo (GitHub OIDC auth)."
    required: true
  pr-number:
    description: "Pull request to draw. Defaults to the pull_request event's."
    required: false
    default: ${{ github.event.pull_request.number }}
  base-sha:
    description: "Base commit of the diff. Defaults to the pull_request event's."
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head-sha:
    description: "Head commit of the diff. Defaults to the pull_request event's."
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  project-slug:
    description: "Infisical project that holds the PR Lens config at its root: PR_LENS_BASE_URL, PR_LENS_MODEL, and PR_LENS_API_KEY."
    required: false
    default: "lazco-pr-lens-ci-shared"
  data-branch:
    description: "Orphan branch the SVGs are committed to. It holds no code and is never merged."
    required: false
    default: "pr-lens"
  comment-author:
    description: "Login that owns the comment. Only its comments are ever edited. Change it when github-token belongs to another identity."
    required: false
    default: "github-actions[bot]"
  branding:
    description: "'true' = keep the PR Lens footer in the comment."
    required: false
    default: "true"
  github-token:
    description: "Token used to publish the SVGs and post the comment."
    required: false
    default: ${{ github.token }}
outputs:
  graph:
    description: "Path of the analyzed graph document."
    value: ${{ steps.analyze.outputs.graph }}
  drawing:
    description: "data-flow | architecture | none. none = the comment carries text only."
    value: ${{ steps.analyze.outputs.drawing }}
  assets-url:
    description: "Base URL the SVGs are published at. Empty when nothing was drawn."
    value: ${{ steps.publish.outputs.assets_url }}
  canvas-url:
    description: "View link of the pull request's canvas. Empty when nothing was drawn or the push failed."
    value: ${{ steps.canvas.outputs.canvas_url }}
  result:
    description: "posted | updated | superseded"
    value: ${{ steps.comment.outputs.result }}
runs:
  using: "composite"
  steps:
    - name: Check the pull request
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        DATA_BRANCH: ${{ inputs.data-branch }}
      run: bash "${{ github.action_path }}/pr-lens.sh" check

    - name: Fetch PR Lens config from Infisical
      uses: Lazco-Corporation/ci-actions/infisical-fetch@v1
      with:
        project-slug: ${{ inputs.project-slug }}
        env-slug: prod
        identity-id: ${{ inputs.identity-id }}
        secret-path: /
        required-keys: PR_LENS_BASE_URL,PR_LENS_MODEL,PR_LENS_API_KEY,PR_LENS_TOKEN

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"

    - name: Install PR Lens
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/pr-lens.sh" install

    # PR_LENS_BASE_URL, PR_LENS_MODEL, and PR_LENS_API_KEY reach this step
    # through $GITHUB_ENV, written by infisical-fetch.
    - name: Analyze the diff
      id: analyze
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${{ github.action_path }}/pr-lens.sh" analyze

    # Applies the repo's `.github/pr-lens.yml` corrections, when present.
    - name: Render the diagrams
      shell: bash
      run: bash "${{ github.action_path }}/pr-lens.sh" render

    - name: Publish the SVGs
      id: publish
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        DATA_BRANCH: ${{ inputs.data-branch }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${{ github.action_path }}/pr-lens.sh" publish

    # PR_LENS_TOKEN reaches this step through $GITHUB_ENV. A failure here is a
    # warning, and the comment goes out without the canvas link.
    - name: Push the canvas
      id: canvas
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        COMMENT_AUTHOR: ${{ inputs.comment-author }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${{ github.action_path }}/pr-lens.sh" canvas

    - name: Post the comment
      id: comment
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        ASSETS_URL: ${{ steps.publish.outputs.assets_url }}
        CANVAS_ID: ${{ steps.canvas.outputs.canvas_id }}
        COMMENT_AUTHOR: ${{ inputs.comment-author }}
        BRANDING: ${{ inputs.branding }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${{ github.action_path }}/pr-lens.sh" comment
