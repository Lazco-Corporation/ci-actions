name: "Require tag on main"
description: "Fail-closed check: refuse a release tag whose commit the release branch does not contain."
inputs:
  repository:
    description: "owner/repo to compare in (github.repository)."
    required: true
  sha:
    description: "Commit the tag points at (github.sha)."
    required: true
  branch:
    description: "Branch that must contain the commit."
    required: false
    default: "main"
  ref-name:
    description: "Tag name, used only in the error message (github.ref_name)."
    required: false
    default: ""
  token:
    description: "GitHub token with contents: read (github.token is enough)."
    required: true
  api-url:
    description: "GitHub API base (github.api_url)."
    required: false
    default: "https://api.github.com"
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        SHA: ${{ inputs.sha }}
        BRANCH: ${{ inputs.branch }}
        REF_NAME: ${{ inputs.ref-name }}
        TOKEN: ${{ inputs.token }}
        API_URL: ${{ inputs.api-url }}
      run: bash "${{ github.action_path }}/require-tag-on-main.sh"
