# PR Lens draws each pull request's architecture and data flow, and keeps one
# comment on the pull request up to date. The model config comes from
# Infisical (lazco-pr-lens-ci-shared, prod, /).
#
# Run it by hand from the Actions tab to draw every open pull request.
# See the pr-lens section of Lazco-Corporation/ci-actions README.md.

name: PR Lens

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-lens:
    uses: ./.github/workflows/reusable-pr-lens.yml
    permissions:
      contents: write # push the SVGs to the pr-lens branch
      pull-requests: write # read the open pull requests, post the comment
      id-token: write # Infisical OIDC
    with:
      identity-id: "4926cec2-6183-49f1-b2b5-2e468cb2cdf6"
