name: "GitOps write-back"
description: "Pin a new image tag into a cloud-infra-gitops overlay kustomization.yaml and push, with a rebase-retry loop for concurrent release runs."
inputs:
  token:
    description: "PAT with Contents: RW on the gitops repo (GITOPS_PAT)."
    required: true
  service:
    description: "Service directory under apps/ in the gitops repo (e.g. api, frontend)."
    required: true
  env-name:
    description: "Overlay environment (staging | prod)."
    required: true
  image-name:
    description: "Full image name including registry org (<org>/<name>); must match the overlay's image name:."
    required: true
  new-tag:
    description: "Tag to pin (<version>-<sha>)."
    required: true
  gitops-repo:
    description: "owner/repo of the gitops repo."
    required: false
    default: "Lazco-Corporation/cloud-infra-gitops"
  target-branch:
    description: "Branch to push to."
    required: false
    default: "main"
  overlay-path:
    description: "Override the derived apps/<svc>/overlays/<env>/kustomization.yaml path (self-test use)."
    required: false
    default: ""
outputs:
  result:
    description: "pushed | already-up-to-date"
    value: ${{ steps.writeback.outputs.result }}
  commit_sha:
    description: "Short sha of the pushed write-back commit (only when result=pushed)."
    value: ${{ steps.writeback.outputs.commit_sha }}
runs:
  using: "composite"
  steps:
    - name: Checkout gitops repo
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: ${{ inputs.gitops-repo }}
        token: ${{ inputs.token }}
        ref: ${{ inputs.target-branch }}
        path: gitops

    # A runner image need not ship yq: Boat's does not. So the action brings its
    # own, pinned by version and checksum, and every runner runs the same yq.
    - name: Install yq
      shell: bash
      env:
        YQ_VERSION: v4.54.1
        YQ_SHA256_AMD64: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        YQ_SHA256_ARM64: 189088da0c6429ec5178dfaab1a114805f6cab0b61b165ab236efedf1d57a71b
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=amd64; sha256="$YQ_SHA256_AMD64" ;;
          aarch64 | arm64) arch=arm64; sha256="$YQ_SHA256_ARM64" ;;
          *) echo "::error title=GitOps write-back failed::no pinned yq for $(uname -m)"; exit 1 ;;
        esac
        bin_dir="${RUNNER_TEMP}/gitops-writeback-bin"
        mkdir -p "$bin_dir"
        curl -fsSL --retry 3 -o "$bin_dir/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${arch}"
        echo "${sha256}  $bin_dir/yq" | sha256sum -c -
        chmod +x "$bin_dir/yq"

    - id: writeback
      shell: bash
      working-directory: gitops
      env:
        SERVICE: ${{ inputs.service }}
        ENV_NAME: ${{ inputs.env-name }}
        IMAGE_NAME: ${{ inputs.image-name }}
        NEW_TAG: ${{ inputs.new-tag }}
        GITOPS_REPO: ${{ inputs.gitops-repo }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        OVERLAY_PATH: ${{ inputs.overlay-path }}
      run: PATH="${RUNNER_TEMP}/gitops-writeback-bin:${PATH}" bash "${{ github.action_path }}/gitops-writeback.sh"
