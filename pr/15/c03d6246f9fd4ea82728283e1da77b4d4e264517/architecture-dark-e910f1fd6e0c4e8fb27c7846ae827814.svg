<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 532" width="1284" height="532" role="img" aria-label="Move PR Lens analysis into Node and choose drawings from the diff" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>Move PR Lens analysis into Node and choose drawings from the diff</title>
<desc>Before, pr-lens.sh ran the PR Lens CLI, which asked a model for architecture and data-flow graphs and always drew both lenses. After, pr-lens.mjs asks the model with a repository-owned prompt that also reads the pull request description, streams the request, retries failed attempts, and validates the document. The drawing is chosen from the diff: up to two data-flow diagrams, else one architecture diagram, else text only. Changes under 20 runtime lines post text only. The comment body is composed in lib.mjs, and the canvas push no longer retries without its walkthrough.</desc>
